services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
