services:
  - type: keyvalue
    name: bank-simulator-redis
    plan: free
    ipAllowList: [] # internal only (same Render private network)
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: bank-simulator
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bank-simulator-redis
          property: connectionString
