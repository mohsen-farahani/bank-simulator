stages:
  - pre-build
  - test
  - build_dev
  - deploy_dev

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"
  CI_DEBUG_TRACE: "false"
  REGISTRY: reg.zarinline.ir
  SVC_DEV_IMAGE: $REGISTRY/zitrin/dev/backend/bank-simulator
  SVC_PROD_IMAGE: $REGISTRY/zitrin/prod/backend/bank-simulator
  DOCKER_BUILDKIT: "1"

# Secrets are injected by CI/CD variables; do NOT hardcode secrets here.

lint:
  stage: pre-build
  image: $REGISTRY/infra/base-images/docker:27.1-dind
  tags:
    - dev-build
  script:
    - docker login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" $REGISTRY
    - cp "$NETRC_FILE" "$CI_PROJECT_DIR/.netrc"
    - |
      docker build \
        --secret id=netrc,src=$CI_PROJECT_DIR/.netrc \
        -t lint:${CI_COMMIT_SHA:0:8} \
        -f deploy/docker/general/lint.Dockerfile \
        .
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - BASE=$(git merge-base HEAD origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME)
    - docker run lint:${CI_COMMIT_SHA:0:8} golangci-lint run --new-from-rev=$BASE --whole-files --timeout 5m
  only:
    - merge_requests
  allow_failure: true

test:
  stage: test
  image: $REGISTRY/infra/base-images/docker:27.1-dind
  tags:
    - dev-build
  script:
    - docker login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" $REGISTRY
    - cp "$NETRC_FILE" "$CI_PROJECT_DIR/.netrc"
    - |
      docker build \
        --secret id=netrc,src=$CI_PROJECT_DIR/.netrc \
        -t test:${CI_COMMIT_SHA:0:8} \
        -f deploy/docker/general/test.Dockerfile \
        .
    - docker run test:${CI_COMMIT_SHA:0:8} /app/deploy/docker/general/scripts/coverage.sh --timeout 5m
  only:
    - merge_requests
  allow_failure: true

build_dev:
  stage: build_dev
  image: $REGISTRY/infra/base-images/docker:27.1-dind
  tags:
    - dev-build
  before_script:
    - docker login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" $REGISTRY
    - docker image rmi --force $SVC_DEV_IMAGE:${CI_COMMIT_SHA:0:8} || true
    - cp "$NETRC_FILE" "$CI_PROJECT_DIR/.netrc"
  script:
    - |
      docker build \
      --secret id=netrc,src=$CI_PROJECT_DIR/.netrc \
      -f deploy/docker/general/Dockerfile \
      -t $SVC_DEV_IMAGE:${CI_COMMIT_SHA:0:8} \
      .
    - docker push $SVC_DEV_IMAGE:${CI_COMMIT_SHA:0:8}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
  allow_failure: false

deploy_dev:
  stage: deploy_dev
  image:
    name: $REGISTRY/infra/base-images/docker:27.1-dind
    entrypoint: [""]
  tags:
    - dev-deploy
  before_script:
    - docker login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" $REGISTRY
  script:
    # NOTE: Replace placeholders in compose with your environment variables in CI settings.
    - export VERSION=${CI_COMMIT_SHA:0:8}
    - IMAGE="$SVC_DEV_IMAGE:${VERSION}" docker compose -f ./deploy/compose/dev/dev-bank-simulator-compose.yml up -d --force-recreate
    - echo "success" > deploy_status.txt
  artifacts:
    paths:
      - deploy_status.txt
  except:
    - production
  only:
    - merge_requests
    - develop
  allow_failure: false




